name: publish

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.4.0)'
        type: string
        required: true
      dry_run:
        description: 'Print the publish commands without actually publishing'
        type: boolean
        required: false
        default: false
      pre_release:
        description: 'Mark this package as a pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-latest
    # Requires manual approval before any build/publish steps run.
    # Configure this environment under Settings > Environments and add
    # required reviewers, plus the VSCE_PERSONAL_ACCESS_TOKEN and OVSX_PAT secrets.
    environment: publish
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      pre_release: ${{ steps.resolve.outputs.pre_release }}
    steps:
      - name: Resolve tag
        id: resolve
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          DISPATCH_PRE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.pre_release }}
          RELEASE_PRE_RELEASE: ${{ github.event.release.prerelease }}
        run: |
          echo "tag=${RELEASE_TAG:-$DISPATCH_TAG}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DISPATCH_DRY_RUN:-false}" >> "$GITHUB_OUTPUT"
          echo "pre_release=${DISPATCH_PRE_RELEASE:-${RELEASE_PRE_RELEASE:-false}}" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Verify tag matches package.json version
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$PACKAGE_VERSION" ]; then
            echo "::error::Tag '$TAG' does not match package.json version 'v$PACKAGE_VERSION'"
            exit 1
          fi

  run-tests:
    name: Test release tag
    needs: validate-release
    uses: ./.github/workflows/run-tests.yml
    with:
      ref: ${{ needs.validate-release.outputs.tag }}

  build-vsix:
    name: Build release VSIX
    needs: [validate-release, run-tests]
    uses: ./.github/workflows/create-vsix-artifact.yml
    with:
      ref: ${{ needs.validate-release.outputs.tag }}

  publish-vscode:
    name: Publish to VS Marketplace
    needs: [build-vsix, validate-release]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Download SHA256
        uses: actions/download-artifact@v4
        with:
          name: vsix-sha256

      - name: Validate VSIX
        id: validate
        run: |
          VSIX_FILE=$(find . -maxdepth 1 -name '*.vsix' | head -n1)
          if [ -z "$VSIX_FILE" ]; then
            echo "::error::No .vsix file found to publish"
            exit 1
          fi
          echo "vsix_file=$VSIX_FILE" >> "$GITHUB_OUTPUT"

      - name: Audit publish attempt
        env:
          VSIX_FILE: ${{ steps.validate.outputs.vsix_file }}
          PRE_RELEASE: ${{ needs.validate-release.outputs.pre_release }}
          DRY_RUN: ${{ needs.validate-release.outputs.dry_run }}
        run: |
          {
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "actor=$GITHUB_ACTOR repository=$GITHUB_REPOSITORY run_id=$GITHUB_RUN_ID"
            echo "marketplace=Visual Studio Marketplace"
            echo "vsix_file=$VSIX_FILE size_bytes=$(stat -c%s "$VSIX_FILE")"
            echo "vsix_sha256=$(cut -d' ' -f1 SHA256.txt)"
            echo "pre_release=$PRE_RELEASE dry_run=$DRY_RUN"
          } | tee -a publish-audit-vscode.log

      - name: Publish
        id: publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PERSONAL_ACCESS_TOKEN }}
          VSIX_FILE: ${{ steps.validate.outputs.vsix_file }}
          PRE_RELEASE: ${{ needs.validate-release.outputs.pre_release }}
          DRY_RUN: ${{ needs.validate-release.outputs.dry_run }}
        run: |
          PRE_RELEASE_FLAG=""
          if [ "$PRE_RELEASE" = "true" ]; then
            PRE_RELEASE_FLAG="--pre-release"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "[dry-run] npx --yes @vscode/vsce publish --packagePath $VSIX_FILE --pat *** $PRE_RELEASE_FLAG"
          else
            ARGS=(--packagePath "$VSIX_FILE" --pat "$VSCE_PAT")
            if [ -n "$PRE_RELEASE_FLAG" ]; then
              ARGS+=("$PRE_RELEASE_FLAG")
            fi
            npx --yes @vscode/vsce publish "${ARGS[@]}"
          fi

      - name: Audit publish result
        if: always() && needs.validate-release.outputs.dry_run != 'true'
        run: echo "outcome=${{ steps.publish.outcome }}" | tee -a publish-audit-vscode.log

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-audit-vscode
          path: publish-audit-vscode.log
          retention-days: 90

  publish-openvsx:
    name: Publish to Open VSX
    needs: [build-vsix, validate-release]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Download SHA256
        uses: actions/download-artifact@v4
        with:
          name: vsix-sha256

      - name: Validate VSIX
        id: validate
        run: |
          VSIX_FILE=$(find . -maxdepth 1 -name '*.vsix' | head -n1)
          if [ -z "$VSIX_FILE" ]; then
            echo "::error::No .vsix file found to publish"
            exit 1
          fi
          echo "vsix_file=$VSIX_FILE" >> "$GITHUB_OUTPUT"

      - name: Audit publish attempt
        env:
          VSIX_FILE: ${{ steps.validate.outputs.vsix_file }}
          PRE_RELEASE: ${{ needs.validate-release.outputs.pre_release }}
          DRY_RUN: ${{ needs.validate-release.outputs.dry_run }}
        run: |
          {
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "actor=$GITHUB_ACTOR repository=$GITHUB_REPOSITORY run_id=$GITHUB_RUN_ID"
            echo "marketplace=Open VSX Registry"
            echo "vsix_file=$VSIX_FILE size_bytes=$(stat -c%s "$VSIX_FILE")"
            echo "vsix_sha256=$(cut -d' ' -f1 SHA256.txt)"
            echo "pre_release=$PRE_RELEASE dry_run=$DRY_RUN"
          } | tee -a publish-audit-openvsx.log

      - name: Publish
        id: publish
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX_FILE: ${{ steps.validate.outputs.vsix_file }}
          PRE_RELEASE: ${{ needs.validate-release.outputs.pre_release }}
          DRY_RUN: ${{ needs.validate-release.outputs.dry_run }}
        run: |
          PRE_RELEASE_FLAG=""
          if [ "$PRE_RELEASE" = "true" ]; then
            PRE_RELEASE_FLAG="--pre-release"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "[dry-run] npx --yes ovsx publish $VSIX_FILE -p *** $PRE_RELEASE_FLAG"
          else
            ARGS=("$VSIX_FILE" -p "$OVSX_PAT")
            if [ -n "$PRE_RELEASE_FLAG" ]; then
              ARGS+=("$PRE_RELEASE_FLAG")
            fi
            npx --yes ovsx publish "${ARGS[@]}"
          fi

      - name: Audit publish result
        if: always() && needs.validate-release.outputs.dry_run != 'true'
        run: echo "outcome=${{ steps.publish.outcome }}" | tee -a publish-audit-openvsx.log

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-audit-openvsx
          path: publish-audit-openvsx.log
          retention-days: 90

  attach-release-assets:
    name: Attach VSIX to release
    if: github.event_name == 'release'
    needs: [validate-release, publish-vscode, publish-openvsx]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Download SHA256
        uses: actions/download-artifact@v4
        with:
          name: vsix-sha256

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-release.outputs.tag }}
          files: |
            *.vsix
            SHA256.txt
