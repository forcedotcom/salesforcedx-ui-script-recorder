name: create-vsix-artifact

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out and package'
        required: false
        type: string
        default: ${{ github.sha }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build and package VSIX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package extension
        run: npm run package

      - name: Compute SHA256
        run: find . -maxdepth 1 -type f -name '*.vsix' -exec shasum -a 256 {} \; | tee SHA256.txt

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'

      - name: Upload SHA256 artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-sha256
          path: SHA256.txt
