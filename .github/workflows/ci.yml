name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-tests:
    name: Test
    uses: ./.github/workflows/run-tests.yml

  build-vsix:
    name: Package (validation)
    uses: ./.github/workflows/create-vsix-artifact.yml
